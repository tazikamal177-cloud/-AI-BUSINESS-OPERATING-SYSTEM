name: CD — Staging deploy

# Triggers:
#   - on push of a tag matching v* (release tags)
#   - manual dispatch with optional ref input (hotfix without tag)
#
# What it does:
#   1. Build backend + frontend images (Linux/amd64)
#   2. Push to GitHub Container Registry (ghcr.io)
#   3. SSH into the staging VM
#   4. Pull the new images, restart the stack, run smoke tests
#
# Rollback: `ssh deploy@vm "cd /opt/aibos && git checkout <previous-tag> && ./scripts/rollback.sh"`
# The rollback script is in scripts/rollback.sh (Phase 11.4 runbook).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, sha). Default: main'
        required: false
        default: 'main'

concurrency:
  group: cd-staging
  cancel-in-progress: false  # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.ref || github.sha) }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/aibos-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/aibos-frontend

jobs:
  # ──────────────────────────────────────────────────────
  # 1. Build + push backend image
  # ──────────────────────────────────────────────────────
  backend-push:
    name: Backend — push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────
  # 2. Build + push frontend image
  # ──────────────────────────────────────────────────────
  frontend-push:
    name: Frontend — push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────
  # 3. Deploy on staging VM
  # ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging VM
    runs-on: ubuntu-latest
    needs: [backend-push, frontend-push]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy scripts to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_VM_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "scripts/,docker/"
          target: /opt/aibos

      - name: Run deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_VM_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command: |
            cd /opt/aibos
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}
            export FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}
            ./scripts/deploy-staging.sh

      - name: Smoke tests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_VM_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command: |
            cd /opt/aibos
            ./scripts/smoke-tests.sh
