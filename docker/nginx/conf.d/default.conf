# ────────────────────────────────────────────────────────────
# AIBOS Staging — Nginx server block
#
# Routing:
#   /                → frontend (Next.js, port 3000)
#   /api/*           → backend  (NestJS,  port 3001)
#   /health          → backend  (proxied through /api/health)
#   /docs            → backend  (Swagger UI)
#
# TLS:
#   - In staging, we ship HTTP-only (port 80) by default.
#   - To enable HTTPS, place cert.pem + key.pem in nginx/certs/
#     and uncomment the redirect + ssl_server block.
#   - certs/ is gitignored.
# ────────────────────────────────────────────────────────────

# Plain HTTP — staging default. Listens on the standard port 80.
server {
    listen      80 default_server;
    server_name _;

    # For Let's Encrypt challenges (uncomment when enabling HTTPS)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # ── API + health + docs → backend ──────────────────────
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Swagger UI
    location /docs {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Everything else → frontend (Next.js) ──────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass         http://frontend:3000;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

