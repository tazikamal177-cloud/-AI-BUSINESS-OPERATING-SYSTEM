# ────────────────────────────────────────────────────────────
# AIBOS — Staging docker-compose
#
# Topologie :
#   internet → nginx (80/443) → frontend (3000)  [pages, /_next/static]
#                              → backend  (3001)  [/api/*, /health, /docs]
#                              ← redis    (6379)  [private network]
#                              ← postgres (5432)  [private network]
#                              ← minio    (9000)  [private network, via backend]
#
# Volumes :
#   - postgres_data, redis_data, minio_data : persistants
#   - /var/log/nginx : logs Nginx (lecture seule par défaut)
#
# Secrets :
#   - lus depuis .env.staging (gitignored, chmod 600)
#   - JAMAIS commités
#
# Usage :
#   cp backend/.env.staging.example backend/.env.staging
#   $EDITOR backend/.env.staging       # remplir les CHANGE_ME
#   docker compose -f docker/docker-compose.staging.yml --env-file backend/.env.staging up -d
# ────────────────────────────────────────────────────────────

name: aibos-staging

services:
  # ──────── Database ────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aibos-postgres-staging
    restart: always
    environment:
      POSTGRES_USER: aibos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
      POSTGRES_DB: aibos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibos -d aibos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No port mapping — backend reaches postgres via the internal network
    deploy:
      resources:
        limits:
          memory: 1G

  # ──────── Redis ────────
  redis:
    image: redis:7-alpine
    container_name: aibos-redis-staging
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.staging}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────── MinIO (S3-compatible) ────────
  minio:
    image: minio/minio:latest
    container_name: aibos-minio-staging
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    volumes:
      - minio_data:/data
    networks:
      - backend
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Internal port 9000 (S3 API) only. Console 9001 is dev-only.
    deploy:
      resources:
        limits:
          memory: 1G

  minio-init:
    image: minio/mc:latest
    container_name: aibos-minio-init-staging
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p local/${S3_BUCKET} || true &&
      mc anonymous set download local/${S3_BUCKET} || true &&
      echo 'MinIO bucket ${S3_BUCKET} ready'
      "

  # ──────── Backend (NestJS) ────────
  backend:
    # Build from the local Dockerfile (Phase 11.1)
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: aibos-backend:staging
    container_name: aibos-backend-staging
    restart: always
    env_file:
      - ../backend/.env.staging
    environment:
      # Override anything that needs to point to docker service names
      DATABASE_URL: postgresql://aibos:${DB_PASSWORD}@postgres:5432/aibos?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    # Run migrations on first start. Idempotent. Failure blocks the
    # container from becoming healthy.
    # Note: prisma migrate deploy is in backend/scripts/migrate.sh
    # We use the entrypoint override pattern below.

  # ──────── Frontend (Next.js) ────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: aibos-frontend:staging
    container_name: aibos-frontend-staging
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────── Nginx (reverse proxy) ────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aibos-nginx-staging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nginx_logs:
